name: playbook
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for secrets, ids, internal names and em dashes
        run: python3 scripts/check_playbook.py
      - name: Build PLAYBOOK.md (the single-file version)
        run: python3 scripts/build_playbook.py
      - name: Build App-Builder-Playbook.pdf (the one file to share)
        run: |
          sudo apt-get install -y -q fonts-dejavu-core >/dev/null || true
          pip install -q markdown weasyprint
          python3 scripts/build_pdf.py
      - uses: actions/upload-artifact@v4
        with:
          name: playbook
          path: |
            PLAYBOOK.md
            App-Builder-Playbook.pdf
  release-assets:
    if: github.event_name == 'release'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playbook
      - name: Attach PLAYBOOK.md and the PDF to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" PLAYBOOK.md App-Builder-Playbook.pdf --clobber --repo "${{ github.repository }}"
