name: Bug report
description: Something in the playbook is wrong, broken or out of date.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste passwords, keys, connection links, customer data or screenshots that show them. Security problems go to the Security tab, not here."
  - type: input
    id: where
    attributes:
      label: Where
      description: File, skill or doc, and the version or release if you know it.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which agent (Claude, ChatGPT, Grok Bot, Cursor or other) and what you said to it.
  - type: checkboxes
    id: safe
    attributes:
      label: Privacy
      options:
        - label: This report contains no secrets or personal data.
          required: true
